services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - default
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatbot
    volumes:
      - reichat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    pull_policy: always

  server:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets "use my own Ollama" reach an Ollama running on the host at
    # http://host.docker.internal:11434 — Docker Desktop provides that name
    # already; Linux Docker Engine needs it mapped.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: build

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - default
    pull_policy: build

volumes:
  # Not "postgres-data": that volume holds the Django-era schema, which the
  # FastAPI backend doesn't read. A new name starts clean and leaves the old
  # data untouched.
  reichat-db:
    driver: local

networks:
  default:
    name: chatbot-network
    driver: bridge
