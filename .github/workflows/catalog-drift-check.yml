name: Catalog drift check

# ollama.com's markup is the only thing the catalog parser depends on, and
# it has already changed once without warning (the bug this whole overhaul
# started from: 231 models silently parsed down to 0, reported as success).
# This runs the real parser against the live site on a schedule so the next
# redesign is caught here, not by a user opening `/models` to an empty page.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      # Only the parser's own two dependencies: the check must not need the
      # rest of the backend (or its lockfile) to run.
      - name: Parse the live ollama.com library page
        working-directory: backend
        run: uv run --no-project --with httpx --with beautifulsoup4 python -m app.catalog.check_live

      - name: Open an issue if parsing broke
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue list --repo "$GITHUB_REPOSITORY" --label catalog-drift --state open --json number --jq '.[0]' | grep -q .; then
            echo "An open catalog-drift issue already exists — not filing a duplicate."
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Catalog parser broke against live ollama.com" \
            --label catalog-drift \
            --body "The scheduled catalog drift check failed: \`backend/app/catalog/parser.py\` could not parse ollama.com's library page (or returned suspiciously few models). ollama.com's markup has likely changed again. See the failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
